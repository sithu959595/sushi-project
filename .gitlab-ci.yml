    #   fi

    # - docker compose run --rm terraform -chdir=deploy/ init
    # - echo "123"
    # - docker compose run --rm terraform -chdir=deploy/ workspace select -or-create $workspace
    # - echo "567d"
    # - docker compose run --rm terraform -chdir=deploy/ apply -auto-approve
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^(main|prod)$/"

Getting React Packages and Upload the App:
  stage: Build React and Upload Frontend App
  script:
    - apk update
    - apk upgrade
    - apk add --no-cache nodejs npm aws-cli
    - node --version
    - npm --version
    - |
      if [[ $CI_COMMIT_BRANCH == 'prod' ]]; then
        workspace="prod"
        url="https://api.${CUSTOM_DOMAIN_NAME}"
      else
        workspace="staging"
        url="https://api.staging.${CUSTOM_DOMAIN_NAME}"
      fi
    - echo "url is ${url}"
    - cd Speed-Typing
    - sed -i -E 's|^([[:space:]]*const[[:space:]]+baseUrl[[:space:]]*=[[:space:]]*)"[^"]*"([[:space:]]*;)|\1"'"$url"'"\2|' CustomHooks/useGameLogic.js
    - npm ci
    - npm run build
    - ls
    - cd ..
    - mkdir dist
    - ls
    - mv ./Speed-Typing/index.html ./dist/
    - mv ./Speed-Typing/index.pack.js ./dist/
    - mv ./Speed-Typing/styles.css ./dist/
    - cd dist
    - apk update && apk add aws-cli
    - ls
    - |
      aws s3 cp index.html "s3://${workspace}-${FRONTEND_HOST_BUCKET}/index.html" \
        --cache-control "no-cache, no-store, must-revalidate" \
        --content-type "text/html"

      aws s3 cp styles.css "s3://${workspace}-${FRONTEND_HOST_BUCKET}/styles.css" \
        --cache-control "no-cache" \
        --content-type "text/css"

      aws s3 cp index.pack.js "s3://${workspace}-${FRONTEND_HOST_BUCKET}/index.pack.js" \
        --cache-control "no-cache" \
        --content-type "application/javascript"
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^(main|prod)$/"

Destroy:
  stage: Destroy
  script:
    - apk update && apk upgrade && apk add --no-cache aws-cli jq
    - |
      if [[ $CI_COMMIT_BRANCH == 'prod' ]]; then
        workspace="prod"
      else
        workspace="staging"
      fi
    - |
      versions_json=$(aws s3api list-object-versions --bucket "${workspace}-${FRONTEND_HOST_BUCKET}" \
        --query 'Versions[].{Key:Key,VersionId:VersionId}' --output json)
      if [ "$(echo "$versions_json" | jq 'length')" -gt 0 ]; then
        echo "$versions_json" | jq '{Objects: ., Quiet: true}' > /tmp/versions.json
        aws s3api delete-objects --bucket "${workspace}-$FRONTEND_HOST_BUCKET" --delete file:///tmp/versions.json
      else
        echo "No object versions found."
      fi
      markers_json=$(aws s3api list-object-versions --bucket "${workspace}-$FRONTEND_HOST_BUCKET" \
        --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' --output json)
      if [ "$(echo "$markers_json" | jq 'length')" -gt 0 ]; then
        echo "$markers_json" | jq '{Objects: ., Quiet: true}' > /tmp/delete-markers.json
        aws s3api delete-objects --bucket "${workspace}-$FRONTEND_HOST_BUCKET" --delete file:///tmp/delete-markers.json
      else
        echo "No delete markers found."
      fi
    - cd infra/
    - echo "dfdfdfad $workspace"
    - docker compose run --rm terraform -chdir=deploy/ init
    - docker compose run --rm terraform -chdir=deploy/ workspace select $workspace
    - docker compose run --rm terraform -chdir=deploy/ destroy -auto-approve
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^(main|prod)$/"
      when: manual
