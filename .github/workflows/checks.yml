name: Sushi checks

on:
  push:
    branches-ignore: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:
  # Deployment calls these same checks before it can access AWS.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  lambda:
    name: Node.js Lambda tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend/terraform/lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/terraform/lambda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  rag:
    name: Python RAG Lambda tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test
        run: python -m unittest discover -s Backend/terraform/lambda-rag/tests -t Backend/terraform/lambda-rag -v

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Check formatting
        run: |
          terraform -chdir=Backend/terraform fmt -check
          terraform fmt -check .github/terraform/backend.tf

      - name: Initialize without a state backend
        run: terraform -chdir=Backend/terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform -chdir=Backend/terraform validate -no-color
